name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '智能彩票号码分析器_V5_手机云端编译版.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name '智能彩票号码分析器_V5_手机云端编译版.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到 ZIP 文件"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          echo "ZIP 文件内容："
          find project -maxdepth 5 -type f | head -n 100

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          SETTINGS=$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "错误：ZIP 中没有 settings.gradle 或 settings.gradle.kts"
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lottery-analyzer-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
